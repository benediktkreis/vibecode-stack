services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: cliproxyapi
    ports:
      - "8317:8317"
      - "1455:1455"
    volumes:
      - ./cliproxyapi/config.yaml:/CLIProxyAPI/config.yaml
      - ./cliproxyapi/auth:/root/.cli-proxy-api
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    depends_on:
      cliproxyapi:
        condition: service_started
    ports:
      - "4001:4001"
    environment:
      CLIPROXYAPI_BASE_URL: ${CLIPROXYAPI_BASE_URL:-http://cliproxyapi:8317/v1}
      CLIPROXYAPI_API_KEY: ${CLIPROXYAPI_API_KEY:-sk-dummy}
      GITHUB_COPILOT_TOKEN_DIR: /root/.config/litellm/github_copilot
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./configs:/app/configs:ro
      - ./github_copilot:/root/.config/litellm/github_copilot
    command: ["--config", "/app/config.yaml", "--port", "4001", "--host", "0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/health/liveliness', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  tailscale:
    image: tailscale/tailscale:latest
    container_name: litellm-tailscale
    hostname: ${TS_HOSTNAME:-litellm-proxy}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env — create a reusable key at https://login.tailscale.com/admin/settings/keys}
      TS_HOSTNAME: ${TS_HOSTNAME:-litellm-proxy}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: ${TS_USERSPACE:-true}
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  cloudflared-quick:
    profiles: ["cloudflare-quick"]
    image: cloudflare/cloudflared:latest
    container_name: litellm-tunnel
    command: tunnel --no-autoupdate --url http://litellm:4001
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tailscale-state:
