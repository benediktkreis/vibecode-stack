# ============================================================
#  LiteLLM Proxy — config.yaml
#    ali-*   -> Alibaba / Qwen Coding Plan
#    or-*    -> OpenRouter
#    *:cloud -> Ollama Cloud
#    cpa-openai* -> CLIProxyAPI (Codex OAuth via local proxy)
#    copilot-* -> GitHub Copilot (optional — enabled at startup when
#               github_copilot/ has access-token or api-key.json)
# ============================================================

include:
  # - configs/alibaba.yaml
  # - configs/openrouter.yaml
  # - configs/ollama-cloud.yaml
  # - configs/opencode.yaml
  - configs/cliproxyapi-openai.yaml
  - configs/github-copilot.yaml

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  request_timeout: 600
  drop_params: true
